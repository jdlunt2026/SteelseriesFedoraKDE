[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steelpanel"
version = "0.1.0"
description = "Manage SteelSeries mice and keyboards on Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rivalcfg>=4.17",
    "openrgb-python>=0.3",
    "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
steelpanel = "steelpanel.__main__:main"

[tool.setuptools.packages.find]
include = ["steelpanel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
